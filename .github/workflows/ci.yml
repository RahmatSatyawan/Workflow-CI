name: CI - MLflow Training Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12.4"

      - name: Create conda environment from conda.yaml
        run: |
          conda env create -f MLProject/conda.yaml

      - name: Train model with MLflow
        run: |
          conda activate mlflow-env
          mlflow run MLProject -P alpha=0.01 -P l1_ratio=0.5

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowers-model-${{ github.run_number }}
          path: |
            mlruns/
          retention-days: 30
