name: CI - MLflow Training Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Install workflow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install kagglehub pillow

      - name: Download dataset and preprocess
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          import kagglehub

          repo_root = Path.cwd()
          path = kagglehub.dataset_download('alxmamaev/flowers-recognition')
          flowers_dir = Path(path) / 'flowers'
          preprocess_script = repo_root / 'preprocessing' / 'automate_Rahmat-Satyawan.py'
          dest_dir = repo_root / 'preprocessing' / 'flowers_preprocessing'

          subprocess.run(
              [sys.executable, str(preprocess_script), '--src', str(flowers_dir), '--dest', str(dest_dir)],
              check=True,
          )
          PY

      - name: Train model with modelling.py
        run: |
          python modelling.py \
            --learning_rate 0.001 \
            --epochs 5 \
            --batch_size 32 \
            --img_size 200 \
            --data_dir preprocessing/flowers_preprocessing

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowers-model-${{ github.run_number }}
          path: |
            mlruns/
          retention-days: 30
